<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f0f7"/>
      <stop offset="100%" style="stop-color:#d0e0ed"/>
    </linearGradient>
    <pattern id="weave" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 L20 10 M10 0 L10 20" stroke="#4a90a4" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <pattern id="weave2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L40 20 M20 0 L20 40" stroke="#2d6a7a" stroke-width="0.8" opacity="0.3"/>
    </pattern>
    <linearGradient id="layer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5a9fb5;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#3d7a8c;stop-opacity:0.4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect x="20" y="40" width="360" height="220" fill="url(#weave)" stroke="#4a90a4" stroke-width="1" opacity="0.5"/>
  <rect x="40" y="60" width="320" height="180" fill="url(#weave2)" stroke="#2d6a7a" stroke-width="0.5" opacity="0.4"/>
  <!-- Honeycomb / composite layers -->
  <polygon points="80,120 120,100 160,120 160,160 120,180 80,160" fill="url(#layer)" stroke="#2d6a7a" stroke-width="0.5" opacity="0.7"/>
  <polygon points="120,100 160,80 200,100 200,140 160,160 120,140" fill="url(#layer)" stroke="#2d6a7a" stroke-width="0.5" opacity="0.6"/>
  <polygon points="120,140 160,160 160,200 120,220 80,200 80,160" fill="url(#layer)" stroke="#2d6a7a" stroke-width="0.5" opacity="0.5"/>
  <polygon points="200,100 240,80 280,100 280,140 240,160 200,140" fill="url(#layer)" stroke="#2d6a7a" stroke-width="0.5" opacity="0.55"/>
  <polygon points="240,80 280,60 320,80 320,120 280,140 240,120" fill="url(#layer)" stroke="#2d6a7a" stroke-width="0.5" opacity="0.7"/>
  <polygon points="200,140 240,160 240,200 200,220 160,200 160,160" fill="url(#layer)" stroke="#2d6a7a" stroke-width="0.5" opacity="0.5"/>
  <!-- Fiber lines -->
  <line x1="100" y1="200" x2="300" y2="220" stroke="#4a90a4" stroke-width="0.5" opacity="0.5"/>
  <line x1="100" y1="200" x2="300" y2="220" stroke="#4a90a4" stroke-width="0.3" opacity="0.3" transform="translate(0,5)"/>
  <line x1="100" y1="200" x2="300" y2="220" stroke="#4a90a4" stroke-width="0.3" opacity="0.3" transform="translate(0,-5)"/>
</svg>
